<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinePrint</title>
<style>
  :root {
    --bg: #f6f8f7;
    --card: #ffffff;
    --text: #1d2b29;
    --muted: #6b7a77;
    --teal: #1f5f5b;
    --teal-dark: #174745;
    --line: #dfe6e4;
    --red: #c0392b;   --red-bg: #fdecea;
    --orange: #c46a00; --orange-bg: #fff2e0;
    --green: #2d7a46;  --green-bg: #e7f5ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 800px; margin: 0 auto; padding: 40px 16px 64px; }
  header { text-align: center; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 2.6rem; letter-spacing: -0.02em; color: var(--teal); }
  .tagline { margin: 4px 0 0; color: var(--muted); font-size: 1.1rem; }

  label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 220px; padding: 14px; resize: vertical;
    border: 1px solid var(--line); border-radius: 14px; background: var(--card);
    font: inherit; color: inherit; box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  textarea:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  .count { margin-top: 6px; font-size: .85rem; color: var(--muted); text-align: right; }
  .count.over { color: var(--red); font-weight: 600; }

  .buttons { display: flex; gap: 12px; margin-top: 16px; }
  button {
    font: inherit; font-weight: 600; border-radius: 12px; padding: 12px 22px;
    cursor: pointer; border: 1px solid transparent;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .primary { background: var(--teal); color: #fff; flex: 1; }
  .primary:hover:not(:disabled) { background: var(--teal-dark); }
  .secondary { background: var(--card); color: var(--teal); border-color: var(--teal); }
  .secondary:hover:not(:disabled) { background: #eef5f4; }

  #message { margin-top: 16px; min-height: 1.5em; font-weight: 600; }
  #message.error { color: var(--red); }
  #message.info { color: var(--muted); }

  #results { margin-top: 28px; }
  .verdict {
    border-radius: 16px; padding: 20px 22px; margin-bottom: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.06);
  }
  .verdict .badge { font-size: 1.8rem; font-weight: 800; letter-spacing: .04em; }
  .verdict p { margin: 6px 0 0; font-size: 1.05rem; }
  .verdict.safe { background: var(--green-bg); color: var(--green); }
  .verdict.caution { background: var(--orange-bg); color: var(--orange); }
  .verdict.avoid { background: var(--red-bg); color: var(--red); }
  .verdict p { color: var(--text); }

  .clause {
    background: var(--card); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); border-left: 6px solid var(--line);
  }
  .clause.high { border-left-color: var(--red); }
  .clause.medium { border-left-color: var(--orange); }
  .clause.low { border-left-color: var(--green); }
  .pill {
    display: inline-block; font-size: .75rem; font-weight: 800; letter-spacing: .06em;
    padding: 3px 10px; border-radius: 999px; margin-bottom: 8px;
  }
  .pill.high { background: var(--red-bg); color: var(--red); }
  .pill.medium { background: var(--orange-bg); color: var(--orange); }
  .pill.low { background: var(--green-bg); color: var(--green); }
  .explanation { font-size: 1.15rem; font-weight: 500; margin: 0 0 8px; }
  .quote { font-size: .85rem; color: var(--muted); font-style: italic; margin: 0; }
  .empty { color: var(--muted); text-align: center; }
  #clear { margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>FinePrint</h1>
    <p class="tagline">Don't just agree. Understand.</p>
  </header>

  <label for="terms">Paste terms and conditions here</label>
  <textarea id="terms" placeholder="Paste the fine print you were about to click 'I agree' on..."></textarea>
  <div class="count" id="count">0 / {{ max_chars }}</div>

  <div class="buttons">
    <button class="primary" id="go">Translate it</button>
    <button class="secondary" id="sample">Try a sample</button>
  </div>

  <div id="message" role="status" aria-live="polite"></div>

  <section id="results" hidden>
    <div id="verdict" class="verdict"></div>
    <div id="clauses"></div>
    <button class="secondary" id="clear">Clear</button>
  </section>
</main>

<script>
const MAX = {{ max_chars }};
const SAMPLE = `By creating an account you agree to these Terms. We may share your personal information, including your activity and contacts, with our partners and advertisers for marketing purposes. Your subscription renews automatically each month at the then-current price until you cancel, and we do not provide refunds for partial months. You grant the Company a perpetual, worldwide, royalty-free license to use, modify and publish any content you upload, and the Company will own all derivative works. You waive your right to sue the Company or join a class action; any dispute must be resolved through binding arbitration chosen by the Company. We may change these Terms at any time without notice, and continued use means you accept the changes.`;

const $ = (id) => document.getElementById(id);
const terms = $("terms"), count = $("count"), message = $("message");
const goBtn = $("go"), sampleBtn = $("sample"), results = $("results");

function updateCount() {
  count.textContent = `${terms.value.length.toLocaleString()} / ${MAX.toLocaleString()}`;
  count.classList.toggle("over", terms.value.length > MAX);
}
function say(text, kind) { message.textContent = text; message.className = kind || ""; }
function setBusy(busy) {
  goBtn.disabled = sampleBtn.disabled = busy;
  if (busy) say("Reading the fine print...", "info");
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;   // textContent keeps AI text from running as HTML
  return e;
}

function render(data) {
  const v = $("verdict");
  v.className = "verdict " + data.verdict;
  v.replaceChildren(el("div", "badge", data.verdict.toUpperCase()), el("p", "", data.verdict_reason));

  const list = $("clauses");
  list.replaceChildren();
  if (!data.clauses.length) {
    list.append(el("p", "empty", "No risky clauses found."));
  }
  for (const c of data.clauses) {
    const card = el("div", "clause " + c.risk);
    card.append(el("span", "pill " + c.risk, c.risk.toUpperCase()));
    card.append(el("p", "explanation", c.explanation));
    if (c.quote) card.append(el("p", "quote", "“" + c.quote + "”"));
    list.append(card);
  }
  results.hidden = false;
  results.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function translate() {
  const text = terms.value;
  if (!text.trim()) { say("Paste some terms first.", "error"); return; }
  if (text.length > MAX) { say(`That's too long. The limit is ${MAX.toLocaleString()} characters.`, "error"); return; }

  results.hidden = true;
  setBusy(true);
  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (!res.ok) { say(data.error || "Something went wrong. Try again.", "error"); return; }
    say("");
    render(data);
  } catch (e) {
    say("Something went wrong. Try again.", "error");
  } finally {
    goBtn.disabled = sampleBtn.disabled = false;
  }
}

goBtn.addEventListener("click", translate);
sampleBtn.addEventListener("click", () => { terms.value = SAMPLE; updateCount(); say(""); });
$("clear").addEventListener("click", () => {
  terms.value = ""; updateCount(); say(""); results.hidden = true;
  window.scrollTo({ top: 0, behavior: "smooth" });
});
terms.addEventListener("input", updateCount);
updateCount();
</script>
</body>
</html>
